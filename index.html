<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Machine Party - Alphabet Survival</title>
    <style>
        /* ================= CSS UI & BẢNG ĐIỀU KHIỂN ================= */
        body { margin: 0; overflow: hidden; background-color: #0a0a0a; color: #fff; font-family: 'Oswald', sans-serif; user-select: none; }
        canvas { display: block; }
        
        .screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, #1a1a1a, #000);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        .hidden { display: none !important; }

        h1 { font-size: 50px; color: #ff3333; letter-spacing: 5px; text-shadow: 0 0 10px #ff0000; margin-bottom: 5px; text-transform: uppercase; text-align: center;}
        .subtitle { font-size: 16px; color: #888; margin-bottom: 40px; text-align: center;}

        /* Nút bấm */
        .btn {
            background: #0088ff; color: white; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; font-family: inherit;
            cursor: pointer; border-radius: 5px; margin: 10px; width: 300px; text-transform: uppercase; box-shadow: 0 4px 15px rgba(0, 136, 255, 0.4);
            transition: 0.2s;
        }
        .btn:hover { background: #00aaff; transform: translateY(-2px); }
        .btn-danger { background: #ff3333; box-shadow: 0 4px 15px rgba(255, 51, 51, 0.4); }
        .btn-danger:hover { background: #ff5555; }
        .btn-secondary { background: #555; box-shadow: 0 4px 15px rgba(85, 85, 85, 0.4); }
        .btn-secondary:hover { background: #666; }
        
        .form-group { display: flex; flex-direction: column; width: 300px; margin-bottom: 15px; }
        .form-group label { color: #00aaff; font-size: 14px; margin-bottom: 5px; font-weight: bold; text-transform: uppercase;}
        input[type="text"], input[type="number"], input[type="password"], select {
            padding: 12px; font-size: 16px; border-radius: 5px; border: 2px solid #333; background: #111; color: #fff; outline: none; font-family: inherit;
        }
        input:focus, select:focus { border-color: #00aaff; }

        /* Bảng Danh Sách Phòng */
        .room-browser { width: 90%; max-width: 800px; height: 50vh; background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 10px; padding: 20px; overflow-y: auto; margin-bottom: 20px;}
        .room-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 15px; margin-bottom: 10px; border-radius: 5px; border-left: 4px solid #0088ff; }
        .room-row.playing { border-left-color: #ff3333; opacity: 0.7; }
        .room-info { display: flex; flex-direction: column; }
        .room-name { font-size: 20px; font-weight: bold; color: #fff; }
        .room-details { font-size: 14px; color: #aaa; margin-top: 5px; }
        .room-details span { margin-right: 15px; }
        .btn-join { width: auto; padding: 10px 20px; margin: 0; font-size: 16px; }

        /* Sảnh Lobby */
        .lobby-container { display: flex; gap: 20px; width: 90%; max-width: 1000px; height: 60vh; }
        .panel { background: rgba(255,255,255,0.05); border: 1px solid #333; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; }
        .panel-title { color: #00aaff; font-size: 24px; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .player-list { flex: 1; list-style: none; padding: 0; margin: 0; overflow-y: auto; }
        .player-item { display: flex; align-items: center; padding: 10px; background: rgba(0,0,0,0.5); margin-bottom: 8px; border-radius: 5px; border-left: 4px solid #fff; }
        .player-color { width: 15px; height: 15px; border-radius: 50%; margin-right: 15px; border: 2px solid #fff; }
        
        /* Chat */
        .chat-box { flex: 1; display: flex; flex-direction: column; height: 100%; }
        .chat-messages { flex: 1; overflow-y: auto; margin-bottom: 10px; font-size: 14px; font-family: sans-serif; display: flex; flex-direction: column; gap: 5px;}
        .chat-msg { padding: 5px 8px; background: rgba(255,255,255,0.05); border-radius: 4px; }
        .chat-sys { color: #888; font-style: italic; }
        .chat-input-row { display: flex; gap: 10px; }
        .chat-input-row input { flex: 1; margin: 0; padding: 10px; font-size: 14px; }
        .chat-input-row button { margin: 0; width: 80px; padding: 10px; }

        /* In-Game UI */
        #gameUI { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; display: none; }
        .top-bar { position: absolute; top: 20px; left: 20px; display: flex; justify-content: space-between; width: calc(100% - 40px); pointer-events: auto; }
        #roomCodeDisplay { font-size: 20px; color: #fff; background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 5px; border: 1px solid #333;}
        #btnLeave { padding: 5px 15px; width: auto; margin: 0; font-size: 16px; pointer-events: auto; }
        #targetBoard { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); font-size: 80px; font-weight: bold; color: #fff; background: rgba(0,0,0,0.8); padding: 10px 50px; border: 4px solid #444; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.8); transition: 0.3s; }
        #statusText { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); font-size: 60px; color: #ff0000; text-transform: uppercase; font-weight: bold; text-shadow: 0 0 20px #ff0000; display: none; z-index: 90;}
        #inGameChatContainer { position: absolute; bottom: 20px; left: 20px; width: 350px; background: rgba(0,0,0,0.4); border-radius: 5px; display: flex; flex-direction: column; pointer-events: auto; border: 1px solid #333; }
        #inGameChatMessages { height: 150px; overflow-y: auto; padding: 10px; font-size: 14px; font-family: sans-serif; display: flex; flex-direction: column; gap: 5px; }
        #inGameChatInput { margin: 0; width: 100%; padding: 10px; font-size: 14px; border: none; border-top: 1px solid #444; border-radius: 0 0 5px 5px; box-sizing: border-box; background: rgba(0,0,0,0.8); color: #fff; }

        /* Scoreboard (Bảng K/D) */
        #scoreboard { display: flex; flex-direction: column; width: 100%; max-width: 700px; margin-top: 20px; }
        .score-row { display: flex; justify-content: space-between; background: rgba(255,255,255,0.1); padding: 15px 25px; margin-bottom: 5px; border-radius: 5px; font-size: 20px; font-weight: bold;}
        .score-header { font-weight: bold; color: #00aaff; border-bottom: 2px solid #00aaff; background: rgba(0, 170, 255, 0.1); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="loadingScreen" class="screen">
        <h1>MACHINE PARTY</h1>
        <div class="subtitle">ĐANG KẾT NỐI MÁY CHỦ...</div>
    </div>

    <div id="mainMenuScreen" class="screen hidden">
        <h1>MACHINE PARTY</h1>
        <div class="subtitle">ALPHABET SURVIVAL EDITION</div>
        <button class="btn" id="navCreateRoom">TẠO PHÒNG</button>
        <button class="btn" id="navJoinRoom">VÀO PHÒNG</button>
    </div>

    <div id="createRoomScreen" class="screen hidden">
        <h1>TẠO PHÒNG</h1>
        <div class="form-group">
            <label>Tên phòng</label>
            <input type="text" id="crRoomName" placeholder="Nhập tên phòng..." maxlength="20">
        </div>
        <div class="form-group">
            <label>Số lượng người chơi tối đa (2-8)</label>
            <input type="number" id="crMaxPlayers" min="2" max="8" value="8">
        </div>
        <div class="form-group">
            <label>Chế độ phòng</label>
            <select id="crPrivacy">
                <option value="public">Tự do (Không cần mật khẩu)</option>
                <option value="private">Riêng tư (Cần mật khẩu)</option>
            </select>
        </div>
        <div class="form-group hidden" id="crPasswordGroup">
            <label>Mật khẩu</label>
            <input type="text" id="crPassword" placeholder="Nhập mật khẩu..." maxlength="15">
        </div>
        <button class="btn" id="btnCreateRoomSubmit">TẠO VÀ VÀO PHÒNG</button>
        <button class="btn btn-secondary" id="btnBackFromCreate">QUAY LẠI</button>
    </div>

    <div id="joinRoomScreen" class="screen hidden">
        <h1>DANH SÁCH PHÒNG</h1>
        <div class="room-browser" id="roomListUI"></div>
        <button class="btn btn-secondary" id="btnBackFromJoin">QUAY LẠI</button>
    </div>

    <div id="lobbyScreen" class="screen hidden">
        <h1 id="lobbyTitle">SẢNH CHỜ</h1>
        <div class="subtitle" id="lobbyRoomDisplay">PHÒNG: ĐANG TẢI...</div>
        <div class="lobby-container">
            <div class="panel" style="flex: 1;">
                <div class="panel-title" id="lobbyPlayerCountTitle">NGƯỜI CHƠI (0/8)</div>
                <ul class="player-list" id="playerListUI"></ul>
                <button class="btn" id="btnStartGame" style="width:100%; margin: 15px 0 0 0; display: none;">BẮT ĐẦU GAME</button>
                <button class="btn btn-danger" id="btnExitLobby" style="width:100%; margin: 10px 0 0 0;">THOÁT PHÒNG</button>
            </div>
            <div class="panel chat-box">
                <div class="panel-title">KÊNH CHAT</div>
                <div class="chat-messages" id="lobbyChatMessages"></div>
                <div class="chat-input-row">
                    <input type="text" id="lobbyChatInput" placeholder="Nhập tin nhắn..." autocomplete="off">
                    <button class="btn" id="btnSendLobbyChat">GỬI</button>
                </div>
            </div>
        </div>
    </div>

    <div id="gameOverScreen" class="screen hidden">
        <h1 style="font-size: 80px;">KẾT THÚC</h1>
        <div class="subtitle" id="winnerAnnouncement">Chờ thống kê...</div>
        <div id="scoreboard"></div>
        <button class="btn" id="btnReturnLobby" style="margin-top: 40px; display: none;">QUAY LẠI SẢNH CHỜ</button>
        <div class="subtitle" id="waitingHostText" style="margin-top: 20px;">Đang chờ chủ phòng...</div>
    </div>

    <div id="gameUI">
        <div class="top-bar">
            <div id="roomCodeDisplay">Phòng: ???</div>
            <button class="btn btn-danger" id="btnLeave">THOÁT PHÒNG</button>
        </div>
        <div id="targetBoard">?</div>
        <div id="statusText">BẠN ĐÃ ƯỚT</div>
        <div id="inGameChatContainer">
            <div id="inGameChatMessages"></div>
            <input type="text" id="inGameChatInput" placeholder="Nhấn Enter để chat..." autocomplete="off">
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, deleteDoc, collection, addDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const myFirebaseConfig = {
            apiKey: "AIzaSyCROSjuKFCXot5arfyhniAr7dVNzGiSlcc",
            authDomain: "machine-fight.firebaseapp.com",
            projectId: "machine-fight",
            storageBucket: "machine-fight.firebasestorage.app",
            messagingSenderId: "51178521196",
            appId: "1:51178521196:web:fb40f24b0a9c1efbacce49",
            measurementId: "G-ETMWQ9K11M"
        };

        const app = initializeApp(myFirebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let myId = null;
        let currentRoomId = null;
        let isHost = false;
        let gameActive = false;
        let players = {};
        let hostGameLoop = null;

        let serverPhase = 'IDLE'; 
        let serverTargetLetter = '?';
        let serverSafeTiles = [];
        let serverDangerLetters = {}; // Lưu trữ cố định chữ sai cho từng ô khi sập bẫy
        let serverRound = 1;

        // GIẢM TỐC ĐỘ DI CHUYỂN
        let myPlayer = { x: 0, z: 0, color: 0xffffff, isAlive: true, score: 0, kills: 0 };
        const moveSpeed = 0.08; 
        const keys = { w: false, a: false, s: false, d: false };
        const gridSize = 9;
        const tileSize = 2;
        const lettersList = ['X', 'Y', 'Z'];

        const screens = {
            loading: document.getElementById('loadingScreen'),
            mainMenu: document.getElementById('mainMenuScreen'),
            createRoom: document.getElementById('createRoomScreen'),
            joinRoom: document.getElementById('joinRoomScreen'),
            lobby: document.getElementById('lobbyScreen'),
            gameOver: document.getElementById('gameOverScreen')
        };

        function showScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            if(screens[screenName]) screens[screenName].classList.remove('hidden');
        }

        // --- TẠO MÔI TRƯỜNG 3D ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        scene.fog = new THREE.Fog(0x0a0a0a, 15, 60);

        const aspect = window.innerWidth / window.innerHeight;
        const d = 15;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(20, 30, 20);
        camera.lookAt(scene.position);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8); scene.add(ambientLight);
        const spotLight = new THREE.SpotLight(0xfffaee, 1.5);
        spotLight.position.set(0, 30, 0); spotLight.castShadow = true; scene.add(spotLight);

        function createTileMaterial(letter, bgColorHex, textColorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = bgColorHex; ctx.fillRect(0, 0, 256, 256);
            if (letter) {
                ctx.fillStyle = textColorHex; ctx.font = 'bold 150px Oswald, sans-serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(letter, 128, 128);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9, metalness: 0.1 });
        }

        const matBlank = createTileMaterial('', '#444444', '#fff');
        const matsNormal = {
            'X': createTileMaterial('X', '#333333', '#ffffff'),
            'Y': createTileMaterial('Y', '#333333', '#ffffff'),
            'Z': createTileMaterial('Z', '#333333', '#ffffff')
        };
        const matsSafe = {
            'X': createTileMaterial('X', '#222222', '#00ff00'),
            'Y': createTileMaterial('Y', '#222222', '#00ff00'),
            'Z': createTileMaterial('Z', '#222222', '#00ff00')
        };
        const matsDanger = {
            'X': createTileMaterial('X', '#660000', '#ff3333'),
            'Y': createTileMaterial('Y', '#660000', '#ff3333'),
            'Z': createTileMaterial('Z', '#660000', '#ff3333')
        };

        const tiles = [];
        const floorGroup = new THREE.Group();
        const tileGeo = new THREE.BoxGeometry(tileSize * 0.9, 0.5, tileSize * 0.9);

        for (let x = 0; x < gridSize; x++) {
            for (let z = 0; z < gridSize; z++) {
                const mesh = new THREE.Mesh(tileGeo, matBlank);
                mesh.position.set((x - Math.floor(gridSize/2)) * tileSize, -0.25, (z - Math.floor(gridSize/2)) * tileSize);
                mesh.receiveShadow = true; mesh.userData = { targetY: -0.25, isDanger: false };
                floorGroup.add(mesh); tiles.push(mesh);
            }
        }
        scene.add(floorGroup);
        const playerMeshes = {};

        // --- ĐĂNG NHẬP FIREBASE ---
        signInAnonymously(auth).then((userCred) => {
            myId = userCred.user.uid;
            showScreen('mainMenu');
        }).catch(err => alert("Lỗi kết nối máy chủ: " + err.message));

        document.getElementById('navCreateRoom').onclick = () => {
            document.getElementById('crRoomName').value = `Phòng của ${myId.substring(0,4)}`;
            showScreen('createRoom');
        };
        document.getElementById('navJoinRoom').onclick = () => { showScreen('joinRoom'); listenToRoomList(); };
        document.getElementById('crPrivacy').onchange = (e) => { document.getElementById('crPasswordGroup').classList.toggle('hidden', e.target.value === 'public'); };
        document.getElementById('btnBackFromCreate').onclick = () => showScreen('mainMenu');
        document.getElementById('btnBackFromJoin').onclick = () => { if(unsubscribeRoomList) unsubscribeRoomList(); showScreen('mainMenu'); };

        // --- TẠO PHÒNG ---
        document.getElementById('btnCreateRoomSubmit').onclick = async () => {
            const name = document.getElementById('crRoomName').value.trim() || "Phòng Ẩn Danh";
            let maxP = parseInt(document.getElementById('crMaxPlayers').value);
            if (isNaN(maxP) || maxP < 2 || maxP > 8) maxP = 8;
            const isPrivate = document.getElementById('crPrivacy').value === 'private';
            const pass = document.getElementById('crPassword').value.trim();

            if (isPrivate && pass === "") return alert("Vui lòng nhập mật khẩu cho phòng riêng tư!");
            const newRoomId = Math.random().toString(36).substring(2, 8).toUpperCase();
            const myColor = Math.floor(Math.random()*16777215);
            
            try {
                await setDoc(doc(db, "rooms", newRoomId), {
                    roomName: name, maxPlayers: maxP, isPrivate: isPrivate, password: pass, status: 'LOBBY', hostId: myId,
                    gameState: { phase: 'IDLE', targetLetter: '?', safeTiles: [], dangerLetters: {}, round: 1 },
                    players: { [myId]: { x: 0, z: 0, color: myColor, isAlive: true, isHost: true, score: 0, kills: 0 } }
                });
                enterLobby(newRoomId, name, true, maxP);
            } catch (error) { alert("Lỗi khi tạo phòng: " + error.message); }
        };

        // --- DANH SÁCH PHÒNG ---
        let unsubscribeRoomList = null;
        function listenToRoomList() {
            const roomListUI = document.getElementById('roomListUI');
            roomListUI.innerHTML = '<div style="text-align:center; color:#888;">Đang quét máy chủ...</div>';

            unsubscribeRoomList = onSnapshot(collection(db, "rooms"), (snapshot) => {
                roomListUI.innerHTML = '';
                if (snapshot.empty) return roomListUI.innerHTML = '<div style="text-align:center; color:#888;">Chưa có phòng nào được tạo.</div>';

                snapshot.forEach(docSnap => {
                    const data = docSnap.data(); const rId = docSnap.id;
                    const pCount = data.players ? Object.keys(data.players).length : 0;
                    const isPlaying = data.status !== 'LOBBY';
                    const statusText = isPlaying ? `<span style="color:#ff3333;">Đang chơi</span>` : `<span style="color:#00ff00;">Phòng chờ</span>`;
                    const lockIcon = data.isPrivate ? '🔒 ' : '🔓 ';

                    const row = document.createElement('div');
                    row.className = `room-row ${isPlaying ? 'playing' : ''}`;
                    row.innerHTML = `
                        <div class="room-info">
                            <div class="room-name">${lockIcon}${data.roomName} (ID: ${rId})</div>
                            <div class="room-details"><span>Người chơi: ${pCount}/${data.maxPlayers}</span><span>Trạng thái: ${statusText}</span></div>
                        </div>
                        <button class="btn btn-join" ${isPlaying || pCount >= data.maxPlayers ? 'disabled style="background:#555;"' : ''}>VÀO PHÒNG</button>
                    `;
                    if (!isPlaying && pCount < data.maxPlayers) row.querySelector('.btn-join').onclick = () => attemptJoinRoom(rId, data);
                    roomListUI.appendChild(row);
                });
            });
        }

        async function attemptJoinRoom(rId, roomData) {
            if (roomData.isPrivate) {
                const inputPass = prompt("Phòng này là phòng riêng tư. Nhập mật khẩu:");
                if (inputPass === null) return;
                if (inputPass !== roomData.password) return alert("Mật khẩu không chính xác!");
            }
            const myColor = Math.floor(Math.random()*16777215);
            try {
                await updateDoc(doc(db, "rooms", rId), { [`players.${myId}`]: { x: 0, z: 0, color: myColor, isAlive: true, isHost: false, score: 0, kills: 0 } });
                if(unsubscribeRoomList) unsubscribeRoomList();
                enterLobby(rId, roomData.roomName, false, roomData.maxPlayers);
            } catch (error) { alert("Không thể vào phòng! Có thể phòng đã bị xóa hoặc đã đầy."); }
        }

        // --- LOBBY VÀ GAME LOGIC ---
        let unsubscribeRoom = null; let unsubscribeChat = null;

        function enterLobby(rId, rName, amIHost, maxP) {
            currentRoomId = rId; isHost = amIHost;
            myPlayer.score = 0; myPlayer.isAlive = true;
            document.getElementById('lobbyTitle').innerText = rName;
            document.getElementById('lobbyRoomDisplay').innerText = `ID PHÒNG: ${rId}`;
            showScreen('lobby');
            document.getElementById('btnStartGame').style.display = isHost ? 'block' : 'none';
            listenToCurrentRoom(); listenToChat();
            sendSystemMessage(`Người chơi [${myId.substring(0,4)}] đã tham gia.`);
        }

        function listenToCurrentRoom() {
            unsubscribeRoom = onSnapshot(doc(db, "rooms", currentRoomId), (docSnap) => {
                if (!docSnap.exists()) return forceLeaveRoom("Phòng đã bị xóa hoặc kết thúc!");
                const data = docSnap.data();
                
                if (data.hostId === myId) { 
                    isHost = true; 
                    document.getElementById('btnStartGame').style.display = 'block';
                    document.getElementById('btnReturnLobby').style.display = 'block';
                    document.getElementById('waitingHostText').style.display = 'none';
                } else {
                    document.getElementById('btnReturnLobby').style.display = 'none';
                    document.getElementById('waitingHostText').style.display = 'block';
                }
                
                players = data.players || {};
                document.getElementById('lobbyPlayerCountTitle').innerText = `NGƯỜI CHƠI (${Object.keys(players).length}/${data.maxPlayers})`;
                updateLobbyUI(); sync3DPlayers();

                if (data.status === 'PLAYING' && !gameActive) startGameClient(data.roomName);
                else if (data.status === 'LOBBY' && gameActive) stopGameClient();
                else if (data.status === 'LOBBY' && !screens.lobby.classList.contains('hidden') === false) stopGameClient();
                else if (data.status === 'GAMEOVER' && gameActive) showGameOver();

                // ĐỒNG BỘ TRẠNG THÁI VÁN ĐẤU
                if (data.status === 'PLAYING' && data.gameState) {
                    const state = data.gameState; let oldPhase = serverPhase;
                    serverPhase = state.phase; 
                    serverTargetLetter = state.targetLetter || '?';
                    serverSafeTiles = state.safeTiles || []; 
                    serverDangerLetters = state.dangerLetters || {}; // Load bộ chữ sai cố định
                    serverRound = state.round || 1;

                    if (oldPhase === 'DROP' && serverPhase === 'IDLE' && myPlayer.isAlive) {
                        myPlayer.score += 10; uploadMyPosition(); 
                    }
                }
            });
        }

        function listenToChat() {
            const q = query(collection(db, "rooms", currentRoomId, "chat"), orderBy("time", "desc"), limit(20));
            unsubscribeChat = onSnapshot(q, (snap) => {
                let msgs = []; snap.forEach(doc => msgs.push(doc.data())); msgs.reverse();
                let htmlStr = msgs.map(m => m.sys ? `<div class="chat-msg chat-sys">${m.text}</div>` : `<div class="chat-msg"><b>${m.sender}:</b> ${m.text}</div>`).join('');
                document.getElementById('lobbyChatMessages').innerHTML = htmlStr;
                document.getElementById('inGameChatMessages').innerHTML = htmlStr;
                document.getElementById('lobbyChatMessages').scrollTop = document.getElementById('lobbyChatMessages').scrollHeight;
                document.getElementById('inGameChatMessages').scrollTop = document.getElementById('inGameChatMessages').scrollHeight;
            });
        }

        async function sendMessage(text, isSys = false) {
            if (!text.trim() || !currentRoomId) return;
            await addDoc(collection(db, "rooms", currentRoomId, "chat"), { text: text, sender: isSys ? "Hệ thống" : myId.substring(0,4), time: Date.now(), sys: isSys });
        }
        const sendSystemMessage = (t) => sendMessage(t, true);

        document.getElementById('btnSendLobbyChat').onclick = () => { sendMessage(document.getElementById('lobbyChatInput').value); document.getElementById('lobbyChatInput').value = ''; };
        document.getElementById('lobbyChatInput').onkeypress = (e) => { if(e.key === 'Enter') document.getElementById('btnSendLobbyChat').click(); };

        const inGameChatInput = document.getElementById('inGameChatInput');
        window.addEventListener('keydown', (e) => {
            if (document.activeElement === inGameChatInput) {
                if (e.key === 'Enter') { sendMessage(inGameChatInput.value); inGameChatInput.value = ''; inGameChatInput.blur(); }
                return;
            }
            if (e.key === 'Enter' && gameActive) { inGameChatInput.focus(); return; }
            if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
        });
        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
        });

        // --- HOST LOGIC (CẬP NHẬT CƠ CHẾ ROLL CHỮ) ---
        document.getElementById('btnStartGame').onclick = async () => {
            // Đảm bảo khởi tạo lại điểm và mạng sống cho TẤT CẢ mọi người khi bắt đầu ván mới
            let updates = { status: 'PLAYING', "gameState.phase": "IDLE", "gameState.round": 1 };
            for (let p in players) {
                updates[`players.${p}.isAlive`] = true;
                updates[`players.${p}.score`] = 0; 
            }
            await updateDoc(doc(db, "rooms", currentRoomId), updates);
            startHostLoop(); 
        };

        function startHostLoop() {
            if (hostGameLoop) clearInterval(hostGameLoop);
            let phaseTime = 0;
            
            hostGameLoop = setInterval(async () => {
                if (!gameActive || !isHost) return clearInterval(hostGameLoop);
                phaseTime++;

                if (serverPhase === 'IDLE' && phaseTime >= 3) {
                    // PHA 1: Quay chữ ngẫu nhiên cả bảng lẫn sàn
                    serverPhase = 'ROLLING'; phaseTime = 0;
                    await updateDoc(doc(db, "rooms", currentRoomId), { "gameState.phase": serverPhase, "gameState.targetLetter": '?' });
                } 
                else if (serverPhase === 'ROLLING' && phaseTime >= 4) {
                    // PHA 2: Chốt chữ, sàn và bảng đều dừng quay
                    serverPhase = 'LOCKED'; phaseTime = 0;
                    
                    let target = lettersList[Math.floor(Math.random()*lettersList.length)];
                    let safeCount = Math.max(1, 20 - (serverRound * 3)); // Số ô an toàn giảm dần
                    let allIndices = Array.from({length: 81}, (_, i) => i);
                    let safeArr = [];
                    for(let i=0; i<safeCount; i++) {
                        let rIdx = Math.floor(Math.random() * allIndices.length);
                        safeArr.push(allIndices[rIdx]); allIndices.splice(rIdx, 1);
                    }
                    
                    // Tạo một bộ "Chữ Sai" tĩnh cho các ô sập bẫy để nó KHÔNG nhảy loạn xạ nữa
                    let dLetters = {};
                    allIndices.forEach(idx => {
                        let wLetters = lettersList.filter(l => l !== target);
                        dLetters[idx] = wLetters[Math.floor(Math.random()*wLetters.length)];
                    });

                    await updateDoc(doc(db, "rooms", currentRoomId), { 
                        "gameState.phase": serverPhase, 
                        "gameState.targetLetter": target,
                        "gameState.safeTiles": safeArr,
                        "gameState.dangerLetters": dLetters
                    });
                }
                else if (serverPhase === 'LOCKED' && phaseTime >= 2) {
                    // PHA 3: Sập bẫy
                    serverPhase = 'DROP'; phaseTime = 0;
                    await updateDoc(doc(db, "rooms", currentRoomId), { "gameState.phase": serverPhase });
                }
                else if (serverPhase === 'DROP' && phaseTime >= 3) {
                    // Kiểm tra kết thúc ván
                    let aliveCount = Object.values(players).filter(p => p.isAlive).length;
                    let totalPlayers = Object.keys(players).length;
                    
                    if (aliveCount === 0 || (aliveCount === 1 && totalPlayers > 1)) {
                        clearInterval(hostGameLoop);
                        await updateDoc(doc(db, "rooms", currentRoomId), { status: 'GAMEOVER' });
                    } else {
                        serverPhase = 'IDLE'; phaseTime = 0; serverRound++;
                        await updateDoc(doc(db, "rooms", currentRoomId), { "gameState.phase": serverPhase, "gameState.round": serverRound });
                    }
                }
            }, 1000);
        }

        // --- CLIENT UI VÀ SCOREBOARD CHI TIẾT ---
        function startGameClient(roomName) {
            showScreen('');
            document.getElementById('gameUI').style.display = 'block';
            document.getElementById('roomCodeDisplay').innerText = `Phòng: ${roomName}`;
            gameActive = true; document.getElementById('statusText').style.display = 'none';

            myPlayer.x = (Math.floor(Math.random() * gridSize) - Math.floor(gridSize/2)) * tileSize;
            myPlayer.z = (Math.floor(Math.random() * gridSize) - Math.floor(gridSize/2)) * tileSize;
            myPlayer.isAlive = true;
            
            camera.position.set(20, 30, 20); camera.lookAt(scene.position);
        }

        function stopGameClient() {
            gameActive = false; document.getElementById('gameUI').style.display = 'none';
            if (hostGameLoop) clearInterval(hostGameLoop);
            showScreen('lobby'); 
        }

        async function forceLeaveRoom(reason = "") {
            if(reason) alert(reason);
            gameActive = false; document.getElementById('gameUI').style.display = 'none';
            if (hostGameLoop) clearInterval(hostGameLoop);
            showScreen('mainMenu');
            if (unsubscribeRoom) unsubscribeRoom();
            if (unsubscribeChat) unsubscribeChat();

            if (currentRoomId) {
                sendSystemMessage(`Người chơi [${myId.substring(0,4)}] đã thoát.`);
                const pCount = Object.keys(players).length;
                if (pCount <= 1) {
                    await deleteDoc(doc(db, "rooms", currentRoomId)).catch(e=>console.log(e));
                } else {
                    await updateDoc(doc(db, "rooms", currentRoomId), { [`players.${myId}`]: deleteDoc() }).catch(e=>console.log(e));
                    if (isHost) {
                        const remainingIds = Object.keys(players).filter(id => id !== myId);
                        if (remainingIds.length > 0) await updateDoc(doc(db, "rooms", currentRoomId), { hostId: remainingIds[0], [`players.${remainingIds[0]}.isHost`]: true });
                    }
                }
            }
            currentRoomId = null; isHost = false;
        }

        window.addEventListener('beforeunload', () => {
            if (currentRoomId) {
                if (Object.keys(players).length <= 1) deleteDoc(doc(db, "rooms", currentRoomId));
                else updateDoc(doc(db, "rooms", currentRoomId), { [`players.${myId}`]: deleteDoc() });
            }
        });

        document.getElementById('btnExitLobby').onclick = () => forceLeaveRoom();
        document.getElementById('btnLeave').onclick = () => forceLeaveRoom();
        document.getElementById('btnReturnLobby').onclick = async () => { if (isHost) await updateDoc(doc(db, "rooms", currentRoomId), { status: 'LOBBY' }); };

        function showGameOver() {
            gameActive = false; document.getElementById('gameUI').style.display = 'none';
            showScreen('gameOver');

            let arr = Object.keys(players).map(k => ({ id: k, ...players[k] }));
            arr.sort((a,b) => b.score - a.score); 
            
            let sbHTML = `<div class="score-row score-header"><span>Người Chơi</span><span>K / D</span><span>Điểm Tổng</span></div>`;
            arr.forEach((p, idx) => {
                let statusInfo = p.isAlive ? '(Sống)' : '(Đã ướt)';
                let deathCount = p.isAlive ? 0 : 1;
                sbHTML += `<div class="score-row" style="color: #${p.color.toString(16).padStart(6,'0')}">
                    <span>#${idx+1} ${p.id.substring(0,4)} ${statusInfo}</span>
                    <span>${p.kills} / ${deathCount}</span>
                    <span>${p.score}</span>
                </div>`;
            });
            document.getElementById('scoreboard').innerHTML = sbHTML;
            document.getElementById('winnerAnnouncement').innerText = (arr[0] && arr[0].isAlive) ? `NGƯỜI CHIẾN THẮNG: ${arr[0].id.substring(0,4)}` : "TẤT CẢ ĐỀU ĐÃ ƯỚT";
        }

        function updateLobbyUI() {
            const listUI = document.getElementById('playerListUI'); listUI.innerHTML = '';
            for (let uid in players) {
                const p = players[uid]; const hexColor = '#' + p.color.toString(16).padStart(6, '0');
                const hostTag = p.isHost ? ' 👑(Chủ)' : ''; const meTag = uid === myId ? ' (Bạn)' : '';
                listUI.innerHTML += `<li class="player-item"><div class="player-color" style="background: ${hexColor}"></div><div>${uid.substring(0,6)}${meTag}${hostTag}</div></li>`;
            }
        }

        function sync3DPlayers() {
            for (let id in playerMeshes) if (!players[id]) { scene.remove(playerMeshes[id]); delete playerMeshes[id]; }
            for (let id in players) {
                if (id === myId) continue;
                const pData = players[id];
                if (!playerMeshes[id]) {
                    playerMeshes[id] = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: pData.color }));
                    playerMeshes[id].castShadow = true; scene.add(playerMeshes[id]);
                }
                playerMeshes[id].position.x = THREE.MathUtils.lerp(playerMeshes[id].position.x, pData.x, 0.1);
                playerMeshes[id].position.z = THREE.MathUtils.lerp(playerMeshes[id].position.z, pData.z, 0.1);
                playerMeshes[id].position.y = pData.isAlive ? 0.5 : -1.5;
            }
        }

        // --- LOOP 3D ---
        let frameCount = 0;
        function animate() {
            requestAnimationFrame(animate);
            frameCount++;

            if (gameActive) {
                const tb = document.getElementById('targetBoard');
                tb.innerText = serverPhase === 'IDLE' ? `VÒNG ${serverRound}` : serverTargetLetter;
                
                if (serverPhase === 'IDLE') tb.style.borderColor = '#444';
                else if (serverPhase === 'ROLLING') {
                    // Cứ 20 khung hình mới roll 1 lần để mắt đọc được chữ
                    if (frameCount % 20 === 0) tb.innerText = lettersList[Math.floor(Math.random()*lettersList.length)];
                    tb.style.borderColor = '#00aaff';
                }
                else if (serverPhase === 'LOCKED' || serverPhase === 'DROP') tb.style.borderColor = '#00ff00';

                tiles.forEach((tile, index) => {
                    if (serverPhase === 'IDLE') {
                        tile.userData.targetY = -0.25; tile.material = matBlank; tile.userData.isDanger = false;
                    } 
                    else if (serverPhase === 'ROLLING') {
                        tile.userData.targetY = -0.25; tile.userData.isDanger = false;
                        if (frameCount % 20 === 0) {
                            tile.material = matsNormal[lettersList[Math.floor(Math.random()*lettersList.length)]];
                        }
                    }
                    else if (serverPhase === 'LOCKED') {
                        tile.userData.targetY = -0.25;
                        if (serverSafeTiles.includes(index)) {
                            tile.material = matsSafe[serverTargetLetter]; tile.userData.isDanger = false;
                        } else {
                            // Gọi tĩnh chữ sai được lấy từ Server (Không bao giờ nhảy nữa)
                            let dl = serverDangerLetters[index] || lettersList.filter(l => l !== serverTargetLetter)[0];
                            tile.material = matsDanger[dl]; tile.userData.isDanger = true;
                        }
                    }
                    else if (serverPhase === 'DROP') {
                        // Vật liệu giữ nguyên giống pha LOCKED
                        if (serverSafeTiles.includes(index)) {
                            tile.material = matsSafe[serverTargetLetter]; tile.userData.isDanger = false;
                        } else {
                            let dl = serverDangerLetters[index] || lettersList.filter(l => l !== serverTargetLetter)[0];
                            tile.material = matsDanger[dl]; tile.userData.isDanger = true;
                            tile.userData.targetY = -2.5; 
                        }
                    }
                    tile.position.y = THREE.MathUtils.lerp(tile.position.y, tile.userData.targetY, 0.1);
                });

                if (myPlayer.isAlive && document.activeElement !== inGameChatInput) {
                    if (keys.w) myPlayer.z -= moveSpeed;
                    if (keys.s) myPlayer.z += moveSpeed;
                    if (keys.a) myPlayer.x -= moveSpeed;
                    if (keys.d) myPlayer.x += moveSpeed;

                    const bound = (gridSize * tileSize) / 2 - 0.5;
                    myPlayer.x = THREE.MathUtils.clamp(myPlayer.x, -bound, bound);
                    myPlayer.z = THREE.MathUtils.clamp(myPlayer.z, -bound, bound);

                    checkDeath(); uploadMyPosition();
                }

                if (!playerMeshes[myId]) {
                    playerMeshes[myId] = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: myPlayer.color }));
                    playerMeshes[myId].castShadow = true; scene.add(playerMeshes[myId]);
                }
                
                playerMeshes[myId].position.x = myPlayer.x;
                playerMeshes[myId].position.z = myPlayer.z;
                
                if (myPlayer.isAlive) {
                    playerMeshes[myId].position.y = 0.5;
                    camera.position.x = THREE.MathUtils.lerp(camera.position.x, myPlayer.x + 20, 0.05);
                    camera.position.z = THREE.MathUtils.lerp(camera.position.z, myPlayer.z + 20, 0.05);
                    camera.position.y = THREE.MathUtils.lerp(camera.position.y, 30, 0.05);
                } else {
                    playerMeshes[myId].position.y = -2; 
                    camera.position.x = THREE.MathUtils.lerp(camera.position.x, 20, 0.02);
                    camera.position.z = THREE.MathUtils.lerp(camera.position.z, 20, 0.02);
                    camera.position.y = THREE.MathUtils.lerp(camera.position.y, 45, 0.02); 
                }
            }
            renderer.render(scene, camera);
        }

        function checkDeath() {
            // FIX QUAN TRỌNG: Chỉ cho phép "Chết" khi bẫy đang SẬP XUỐNG
            if (!myPlayer.isAlive || serverPhase !== 'DROP') return; 
            
            let closestTile = null; let minDist = Infinity;
            tiles.forEach(tile => {
                const dist = new THREE.Vector3(myPlayer.x, 0.5, myPlayer.z).distanceTo(new THREE.Vector3(tile.position.x, 0.5, tile.position.z));
                if (dist < minDist) { minDist = dist; closestTile = tile; }
            });
            
            if (closestTile && closestTile.position.y < -1) {
                myPlayer.isAlive = false; 
                const st = document.getElementById('statusText');
                st.innerText = "BẠN ĐÃ ƯỚT"; st.style.display = 'block'; 
                setTimeout(() => { st.style.display = 'none'; }, 1000);
                uploadMyPosition();
            }
        }

        let lastUpdate = 0;
        async function uploadMyPosition() {
            let now = Date.now();
            if (now - lastUpdate > 100 || !myPlayer.isAlive) { 
                lastUpdate = now;
                await updateDoc(doc(db, "rooms", currentRoomId), {
                    [`players.${myId}.x`]: myPlayer.x, [`players.${myId}.z`]: myPlayer.z,
                    [`players.${myId}.isAlive`]: myPlayer.isAlive, [`players.${myId}.score`]: myPlayer.score
                }).catch(()=>{});
            }
        }

        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect; camera.right = d * aspect; camera.top = d; camera.bottom = -d;
            camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
