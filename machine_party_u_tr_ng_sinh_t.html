<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Machine Party - Đấu Trường Sinh Tử</title>
    <style>
        body {
            margin: 0; overflow: hidden; background-color: #050505; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; -webkit-user-select: none;
        }
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px; box-sizing: border-box;
        }
        .header { text-align: center; text-shadow: 0 0 10px rgba(255, 0, 0, 0.5); }
        h1 { margin: 0; font-size: 36px; text-transform: uppercase; letter-spacing: 4px; color: #ff3333; font-weight: 900; }
        #status-message { font-size: 18px; color: #e0e0e0; margin-top: 5px; font-weight: bold; transition: color 0.3s; }
        
        #lobby-ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95); padding: 40px; border: 2px solid #555;
            border-radius: 10px; text-align: center; pointer-events: auto;
            min-width: 300px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.8); z-index: 20;
        }
        #lobby-ui h2 { color: #00aaff; margin-top: 0; font-size: 28px; }
        #player-list { list-style: none; padding: 0; margin: 20px 0; text-align: left; }
        #player-list li { padding: 10px; background: rgba(255,255,255,0.1); margin-bottom: 5px; border-radius: 5px; font-weight: bold; }
        .host-badge { color: #ffaa00; float: right; font-size: 12px; margin-top: 4px; }
        
        button {
            background: #ff3333; color: white; border: none;
            padding: 15px 30px; font-size: 18px; cursor: pointer;
            font-weight: bold; border-radius: 5px; transition: background 0.2s; width: 100%;
            text-transform: uppercase;
        }
        button:hover { background: #ff6666; }
        button:disabled { background: #555; cursor: not-allowed; }

        #joystick-zone {
            position: absolute; bottom: 20px; left: 20px;
            width: 150px; height: 150px; pointer-events: auto;
        }
        #mobile-hint { position: absolute; bottom: 20px; right: 20px; font-size: 14px; color: #888; text-align: right; }
    </style>
    <!-- Three.js & NippleJS cho Mobile Joystick -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
</head>
<body>
    <div id="ui-layer">
        <div class="header">
            <h1>MACHINE PARTY</h1>
            <div id="status-message">KẾT NỐI MÁY CHỦ...</div>
        </div>
        <div id="mobile-hint">
            PC: Dùng W, A, S, D<br>
            Mobile: Dùng Joystick bên trái
        </div>
    </div>
    <div id="joystick-zone"></div>
    
    <div id="lobby-ui">
        <h2>SẢNH CHỜ (8 NGƯỜI)</h2>
        <ul id="player-list">
            <!-- Danh sách người chơi sẽ được render vào đây -->
        </ul>
        <button id="btn-start-game" style="display: none;">BẮT ĐẦU TRẬN ĐẤU</button>
        <p id="waiting-msg" style="color: #888; margin-top: 15px;">Đang chờ chủ phòng bắt đầu...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, updateDoc, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Khởi tạo Firebase từ môi trường
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'machine-party-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Biến toàn cục
        let userId = null;
        let isHost = false;
        let localPlayerColor = 0xffffff;
        const PLAYER_COLORS = [0x00aaff, 0xff3333, 0x33ff33, 0xffff33, 0xff33ff, 0x33ffff, 0xffaa00, 0xffffff];
        
        // Quản lý Multiplayer
        const remotePlayers = {}; // Lưu trữ entity của người chơi khác
        const statusMsg = document.getElementById('status-message');
        const lobbyUi = document.getElementById('lobby-ui');
        const playerListUI = document.getElementById('player-list');
        const btnStart = document.getElementById('btn-start-game');
        const waitingMsg = document.getElementById('waiting-msg');

        // CẤU HÌNH TRÒ CHƠI
        const GRID_SIZE = 9;
        const TILE_SIZE = 2;
        let isGameRunning = false;
        let clock = new THREE.Clock();

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.02);

        const aspect = window.innerWidth / window.innerHeight;
        const d = 14; 
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(20, 25, 20);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x222222);
        scene.add(ambientLight);

        const mainSpotLight = new THREE.SpotLight(0xfff0dd, 2);
        mainSpotLight.position.set(0, 40, 0);
        mainSpotLight.angle = Math.PI / 3;
        mainSpotLight.penumbra = 0.5;
        mainSpotLight.castShadow = true;
        mainSpotLight.shadow.mapSize.width = 2048;
        mainSpotLight.shadow.mapSize.height = 2048;
        scene.add(mainSpotLight);

        const warningLight = new THREE.PointLight(0xff0000, 0, 30);
        warningLight.position.set(0, 15, 0);
        scene.add(warningLight);

        const floorGroup = new THREE.Group();
        const tiles = []; // Phẳng hóa mảng lưới để dễ đồng bộ (0 đến 80)
        const tileMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.9, metalness: 0.6 });
        const dangerMat = new THREE.MeshStandardMaterial({ color: 0xff1111, emissive: 0x660000, roughness: 0.2 });
        const tileGeo = new THREE.BoxGeometry(TILE_SIZE * 0.95, 1, TILE_SIZE * 0.95);

        let tileIndex = 0;
        for (let x = 0; x < GRID_SIZE; x++) {
            for (let z = 0; z < GRID_SIZE; z++) {
                const mesh = new THREE.Mesh(tileGeo, tileMat);
                const posX = (x - Math.floor(GRID_SIZE/2)) * TILE_SIZE;
                const posZ = (z - Math.floor(GRID_SIZE/2)) * TILE_SIZE;
                mesh.position.set(posX, -0.5, posZ);
                mesh.receiveShadow = true;
                
                mesh.userData = { id: tileIndex, originalY: -0.5, isDanger: false };
                floorGroup.add(mesh);
                tiles.push(mesh);
                tileIndex++;
            }
        }
        scene.add(floorGroup);

        const input = { x: 0, z: 0 };
        const keys = { w: false, a: false, s: false, d: false };

        window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

        const joystickManager = nipplejs.create({
            zone: document.getElementById('joystick-zone'),
            mode: 'static',
            position: { left: '50%', top: '50%' },
            color: '#ff3333'
        });

        joystickManager.on('move', (evt, data) => {
            const force = Math.min(data.force, 1);
            input.x = Math.cos(data.angle.radian) * force;
            input.z = -Math.sin(data.angle.radian) * force; 
        });
        joystickManager.on('end', () => { input.x = 0; input.z = 0; });

        function getMovementVector() {
            let moveX = input.x; let moveZ = input.z;
            if (keys.w || keys.s || keys.a || keys.d) {
                moveX = 0; moveZ = 0;
                if (keys.w) moveZ = -1;
                if (keys.s) moveZ = 1;
                if (keys.a) moveX = -1;
                if (keys.d) moveX = 1;
                if (moveX !== 0 && moveZ !== 0) {
                    const len = Math.sqrt(moveX*moveX + moveZ*moveZ);
                    moveX /= len; moveZ /= len;
                }
            }
            return { x: moveX, z: moveZ };
        }

        // Sử dụng mô hình khối có màu sắc ngẫu nhiên để load nhanh cho 8 người
        function createPlayerMesh(colorHex) {
            const group = new THREE.Group();
            const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.2, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.7, metalness: 0.3 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            body.castShadow = true;
            
            const headGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
            const headMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.5;
            head.castShadow = true;

            // Mắt phát sáng
            const eyeGeo = new THREE.BoxGeometry(0.4, 0.15, 0.1);
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff });
            const eye = new THREE.Mesh(eyeGeo, eyeMat);
            eye.position.set(0, 1.5, 0.32);
            
            group.add(body); group.add(head); group.add(eye);
            return group;
        }

        class PlayerEntity {
            constructor(startX, startZ, colorHex, isLocal) {
                this.isLocal = isLocal;
                this.isAlive = true;
                this.speed = 6.0;
                this.mesh = createPlayerMesh(colorHex);
                this.mesh.position.set(startX, 0, startZ);
                scene.add(this.mesh);
                this.targetPos = new THREE.Vector3(startX, 0, startZ); // Dùng cho lerp (người chơi khác)
                this.targetRot = 0;
            }

            updateLocal(dt, moveX, moveZ) {
                if (!this.isAlive) return;
                const isMoving = Math.abs(moveX) > 0.01 || Math.abs(moveZ) > 0.01;

                if (isMoving) {
                    this.mesh.position.x += moveX * this.speed * dt;
                    this.mesh.position.z += moveZ * this.speed * dt;
                    this.mesh.rotation.y = Math.atan2(moveX, moveZ);

                    const bound = (GRID_SIZE * TILE_SIZE) / 2 - 0.5;
                    this.mesh.position.x = THREE.MathUtils.clamp(this.mesh.position.x, -bound, bound);
                    this.mesh.position.z = THREE.MathUtils.clamp(this.mesh.position.z, -bound, bound);
                }
            }

            updateRemoteInterpolation(dt) {
                if (!this.isAlive) return;
                // Nội suy (Lerp) vị trí của người chơi khác để trông mượt mà
                this.mesh.position.lerp(this.targetPos, dt * 10);
                
                // Nội suy xoay
                const maxRotDist = Math.PI * 2;
                let rotDiff = (this.targetRot - this.mesh.rotation.y) % maxRotDist;
                if (rotDiff !== rotDiff % (maxRotDist/2)) {
                    rotDiff = (rotDiff < 0) ? rotDiff + maxRotDist : rotDiff - maxRotDist;
                }
                this.mesh.rotation.y += rotDiff * dt * 10;
            }

            die() {
                if(!this.isAlive) return;
                this.isAlive = false;
                this.mesh.scale.y = 0.1;
                this.mesh.position.y = -0.5;
            }
        }

        let localPlayer = null;

        const playersRef = collection(db, 'artifacts', appId, 'public', 'data', 'players');
        const gameStateRef = doc(db, 'artifacts', appId, 'public', 'data', 'gameState', 'global');

        async function initGame() {
            try {
                // Đăng nhập 
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                userId = auth.currentUser.uid;
                localPlayerColor = PLAYER_COLORS[Math.floor(Math.random() * PLAYER_COLORS.length)];
                
                // Spawn Local Player
                localPlayer = new PlayerEntity(0, 0, localPlayerColor, true);

                // Ghi danh lên Firestore
                await setDoc(doc(playersRef, userId), {
                    x: 0, z: 0, rot: 0, isAlive: true, color: localPlayerColor, joinedAt: Date.now()
                });

                // Kiểm tra xem phòng đã có host chưa
                const gameStateSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'gameState'));
                if (gameStateSnap.empty || !gameStateSnap.docs[0].exists()) {
                    // Trở thành Host
                    isHost = true;
                    btnStart.style.display = 'block';
                    waitingMsg.style.display = 'none';
                    await setDoc(gameStateRef, {
                        phase: 'LOBBY', hostId: userId, traps: [], timestamp: Date.now()
                    });
                }

                setupNetworkListeners();
                
                // Bắt đầu gửi tọa độ định kỳ (10 lần / giây để tiết kiệm băng thông)
                setInterval(sendLocalState, 100);

                // Lắng nghe phím tắt/thoát trang
                window.addEventListener('beforeunload', () => {
                    deleteDoc(doc(playersRef, userId));
                });
                
                animate(); // Khởi động vòng lặp render 3D
            } catch (err) {
                console.error("Lỗi khởi tạo Firebase:", err);
                statusMsg.innerText = "LỖI KẾT NỐI MÁY CHỦ";
                statusMsg.style.color = "#ff0000";
            }
        }

        function setupNetworkListeners() {
            if (!userId) return;

            // 1. Lắng nghe cập nhật người chơi
            onSnapshot(playersRef, (snapshot) => {
                playerListUI.innerHTML = '';
                let playerCount = 0;

                snapshot.docs.forEach(docSnap => {
                    const data = docSnap.data();
                    const pid = docSnap.id;
                    playerCount++;

                    // Cập nhật giao diện Lobby
                    const li = document.createElement('li');
                    li.innerText = `Player ${pid.substring(0,5)} ${pid === userId ? '(Bạn)' : ''}`;
                    li.style.borderLeft = `5px solid #${data.color.toString(16).padStart(6, '0')}`;
                    if(data.isAlive === false) li.style.opacity = '0.5';
                    playerListUI.appendChild(li);

                    if (pid !== userId) {
                        // Người chơi khác
                        if (!remotePlayers[pid]) {
                            remotePlayers[pid] = new PlayerEntity(data.x, data.z, data.color, false);
                        }
                        remotePlayers[pid].targetPos.set(data.x, 0, data.z);
                        remotePlayers[pid].targetRot = data.rot;
                        
                        if (!data.isAlive && remotePlayers[pid].isAlive) {
                            remotePlayers[pid].die();
                        }
                    }
                });

                document.querySelector('#lobby-ui h2').innerText = `SẢNH CHỜ (${playerCount}/8)`;

                // Xóa những người đã thoát
                Object.keys(remotePlayers).forEach(pid => {
                    if (!snapshot.docs.find(d => d.id === pid)) {
                        scene.remove(remotePlayers[pid].mesh);
                        delete remotePlayers[pid];
                    }
                });
            }, (err) => console.error(err));

            // 2. Lắng nghe Trạng thái trò chơi (GameState)
            onSnapshot(gameStateRef, (docSnap) => {
                if (!docSnap.exists()) return;
                const data = docSnap.data();

                // Cập nhật badge Host trên giao diện nếu cần
                if(data.hostId && document.querySelector('#lobby-ui h2')) {
                   // host update
                }

                if (data.phase === 'LOBBY') {
                    lobbyUi.style.display = 'block';
                    isGameRunning = false;
                } 
                else {
                    lobbyUi.style.display = 'none';
                    isGameRunning = true;
                    
                    if (data.phase === 'SAFE') {
                        statusMsg.innerText = "SỐNG SÓT: DI CHUYỂN";
                        statusMsg.style.color = "#00ff00";
                        warningLight.intensity = 0;
                        resetTraps();
                    } 
                    else if (data.phase === 'WARNING') {
                        statusMsg.innerText = "CẢNH BÁO: BẪY KÍCH HOẠT!";
                        statusMsg.style.color = "#ffaa00";
                        warningLight.intensity = 2;
                        highlightTraps(data.traps);
                    } 
                    else if (data.phase === 'DROP') {
                        statusMsg.innerText = "RƠI XUỐNG!";
                        statusMsg.style.color = "#ff3333";
                        warningLight.intensity = 0;
                        dropTraps(data.traps);
                        checkLocalDeath(data.traps);
                    }
                }
            }, (err) => console.error(err));
        }

        async function sendLocalState() {
            if (!userId || !localPlayer || !localPlayer.isAlive) return;
            try {
                await updateDoc(doc(playersRef, userId), {
                    x: localPlayer.mesh.position.x,
                    z: localPlayer.mesh.position.z,
                    rot: localPlayer.mesh.rotation.y
                });
            } catch (e) { /* ignore rapid failures */ }
        }

        let hostCycleTime = 0;
        let currentPhase = 'LOBBY';

        btnStart.addEventListener('click', async () => {
            if (!isHost) return;
            await updateDoc(gameStateRef, { phase: 'SAFE', traps: [] });
            currentPhase = 'SAFE';
            hostCycleTime = 0;
        });

        // Host tự chạy mô phỏng thời gian và đổi Phase
        function runHostLogic(dt) {
            if (!isHost || currentPhase === 'LOBBY') return;
            
            hostCycleTime += dt;

            // Chu kỳ 1: An toàn (4 giây)
            if (currentPhase === 'SAFE' && hostCycleTime > 4.0) {
                currentPhase = 'WARNING';
                hostCycleTime = 0;
                
                // Tạo bẫy ngẫu nhiên (30% đến 40% lưới)
                const newTraps = [];
                for(let i=0; i<tiles.length; i++) {
                    if (Math.random() < 0.35) newTraps.push(i);
                }
                updateDoc(gameStateRef, { phase: 'WARNING', traps: newTraps, timestamp: Date.now() });
            }

            // Chu kỳ 2: Cảnh báo đỏ (3 giây)
            if (currentPhase === 'WARNING' && hostCycleTime > 3.0) {
                currentPhase = 'DROP';
                hostCycleTime = 0;
                // Không đổi mảng traps, chỉ đổi pha
                updateDoc(gameStateRef, { phase: 'DROP' });
            }

            // Chu kỳ 3: Sụp đổ (2.5 giây)
            if (currentPhase === 'DROP' && hostCycleTime > 2.5) {
                currentPhase = 'SAFE';
                hostCycleTime = 0;
                updateDoc(gameStateRef, { phase: 'SAFE', traps: [] });
            }
        }

        function resetTraps() {
            tiles.forEach(tile => {
                tile.position.y = tile.userData.originalY;
                tile.material = tileMat;
                tile.userData.isDanger = false;
            });
        }

        function highlightTraps(trapIndices) {
            if(!trapIndices) return;
            trapIndices.forEach(idx => {
                if (tiles[idx]) {
                    tiles[idx].material = dangerMat;
                    tiles[idx].userData.isDanger = true;
                }
            });
        }

        function dropTraps(trapIndices) {
            if(!trapIndices) return;
            trapIndices.forEach(idx => {
                if (tiles[idx]) {
                    tiles[idx].position.y = -5;
                }
            });
        }

        function checkLocalDeath() {
            if (!localPlayer || !localPlayer.isAlive) return;

            let closestTile = null;
            let minDist = Infinity;
            const pPos = new THREE.Vector3(localPlayer.mesh.position.x, 0, localPlayer.mesh.position.z);

            tiles.forEach(tile => {
                const dist = pPos.distanceTo(new THREE.Vector3(tile.position.x, 0, tile.position.z));
                if (dist < minDist) {
                    minDist = dist;
                    closestTile = tile;
                }
            });

            // Nếu ô gần nhất là bẫy và đang ở tâm ô
            if (closestTile && closestTile.userData.isDanger && minDist < (TILE_SIZE * 0.7)) {
                localPlayer.die();
                statusMsg.innerText = "BẠN ĐÃ BỊ LOẠI!";
                statusMsg.style.color = "#ff0000";
                
                // Báo cho server
                updateDoc(doc(playersRef, userId), { isAlive: false });
            }
        }

        // Responsive Camera
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect; camera.right = d * aspect;
            camera.top = d; camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            if (isGameRunning) {
                // Local Player Update (Immediate feedback)
                if (localPlayer) {
                    const vec = getMovementVector();
                    localPlayer.updateLocal(dt, vec.x, vec.z);
                }
                
                // Remote Players Interpolation
                Object.values(remotePlayers).forEach(rp => rp.updateRemoteInterpolation(dt));

                // Host Simulation
                runHostLogic(dt);

                // Flashing light effect during WARNING
                if (warningLight.intensity > 0) {
                    warningLight.intensity = Math.abs(Math.sin(Date.now() * 0.01)) * 3;
                }
            }

            renderer.render(scene, camera);
        }

        // BẮT ĐẦU APP
        initGame();

    </script>
</body>
</html>
